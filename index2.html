<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Compte à Rebours - Version Web</title>
    <style>
        /* Le CSS reste ici pour la mise en page */
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .compteur-container { display: flex; gap: 30px; }
        .bloc { text-align: center; }
        .chiffre { display: block; line-height: 1; }
        .unite { display: block; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="compteur-container">
        <div class="bloc">
            <span id="jours" class="chiffre">00</span>
            <span class="unite">Jours</span>
        </div>
        <div class="bloc">
            <span id="heures" class="chiffre">00</span>
            <span class="unite">Heures</span>
        </div>
        <div class="bloc">
            <span id="minutes" class="chiffre">00</span>
            <span class="unite">Minutes</span>
        </div>
        <div class="bloc">
            <span id="secondes" class="chiffre">00</span>
            <span class="unite">Secondes</span>
        </div>
    </div>

    <script>
        // ========================================================
        //  ZONE DE CONFIGURATION UNIQUE
        // ========================================================
        const CONFIG = {
            dateFin: new Date(2026, 9, 11, 9, 0).getTime(), // 5 = Juin
            couleurFond: "#FFFFFF",
            couleurChiffres: "#5D0B72",
            couleurTexte: "#5D0B72",
            policeChiffres: "bold 60px Verdana, sans-serif",
            policeUnites: "italic 15px Arial, sans-serif"
        };

        // ========================================================
        //  LOGIQUE (NE PAS TOUCHER)
        // ========================================================
        function appliquerStyle() {
            document.body.style.backgroundColor = CONFIG.couleurFond;
            document.querySelectorAll('.chiffre').forEach(el => {
                el.style.color = CONFIG.couleurChiffres;
                el.style.font = CONFIG.policeChiffres;
            });
            document.querySelectorAll('.unite').forEach(el => {
                el.style.color = CONFIG.couleurTexte;
                el.style.font = CONFIG.policeUnites;
            });
        }

        function calculer() {
            const maintenant = new Date().getTime();
            const diff = CONFIG.dateFin - maintenant;

            if (diff <= 0) {
                document.querySelectorAll('.chiffre').forEach(el => el.style.color = "red");
                return;
            }

            const j = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("jours").innerText = j.toString().padStart(2, '0');
            document.getElementById("heures").innerText = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = m.toString().padStart(2, '0');
            document.getElementById("secondes").innerText = s.toString().padStart(2, '0');
        }

        // Lancement immédiat
        appliquerStyle();
        calculer();
        setInterval(calculer, 1000);
    </script>
</body>
</html>
